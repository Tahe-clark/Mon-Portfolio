<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Illustration de la plateforme VoteBal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="95%">
      <stop offset="0" stop-color="#7A5A28"/><stop offset=".55" stop-color="#2E2012"/><stop offset="1" stop-color="#150E08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8DE9A"/><stop offset=".5" stop-color="#E0B155"/><stop offset="1" stop-color="#A97A2B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0B155"/><stop offset="1" stop-color="#F2845C"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g fill="#F8DE9A" opacity=".5">
    <circle cx="190" cy="160" r="4"/><circle cx="320" cy="90" r="3"/><circle cx="1380" cy="140" r="4"/><circle cx="1480" cy="260" r="3"/>
    <circle cx="120" cy="820" r="3"/><circle cx="1500" cy="860" r="4"/><circle cx="1260" cy="70" r="2"/><circle cx="420" cy="900" r="2"/>
  </g>

  <!-- Couronne -->
  <g transform="translate(800 170)" filter="url(#sh)">
    <path d="M-120 60 L-150 -60 L-75 -10 L0 -90 L75 -10 L150 -60 L120 60 Z" fill="url(#gold)"/>
    <rect x="-125" y="62" width="250" height="34" rx="10" fill="url(#gold)"/>
    <circle cx="-150" cy="-66" r="14" fill="#F8DE9A"/><circle cx="0" cy="-98" r="16" fill="#F8DE9A"/><circle cx="150" cy="-66" r="14" fill="#F8DE9A"/>
  </g>
  <text x="800" y="340" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#FFF4DA" text-anchor="middle">Élection du bal</text>

  <!-- Carte Roi -->
  <g transform="translate(250 400)" filter="url(#sh)" font-family="Arial, sans-serif">
    <rect width="500" height="440" rx="28" fill="#211710" stroke="#6B5026" stroke-width="3"/>
    <circle cx="250" cy="120" r="70" fill="#3A2A18" stroke="url(#gold)" stroke-width="6"/>
    <circle cx="250" cy="102" r="26" fill="#8C6A3A"/><path d="M200 168 a50 44 0 0 1 100 0" fill="#8C6A3A"/>
    <text x="250" y="240" font-size="30" font-weight="700" fill="#FFF4DA" text-anchor="middle">Roi</text>
    <text x="250" y="278" font-size="20" fill="#C9AE84" text-anchor="middle">Candidat n° 3</text>
    <rect x="50" y="320" width="400" height="18" rx="9" fill="#3A2A18"/><rect x="50" y="320" width="290" height="18" rx="9" fill="url(#bar)"/>
    <rect x="130" y="364" width="240" height="52" rx="26" fill="url(#gold)"/>
    <text x="250" y="398" font-size="22" font-weight="700" fill="#2A1C0D" text-anchor="middle">Voter</text>
  </g>

  <!-- Carte Reine -->
  <g transform="translate(850 400)" filter="url(#sh)" font-family="Arial, sans-serif">
    <rect width="500" height="440" rx="28" fill="#211710" stroke="#6B5026" stroke-width="3"/>
    <circle cx="250" cy="120" r="70" fill="#3A2A18" stroke="url(#gold)" stroke-width="6"/>
    <circle cx="250" cy="102" r="26" fill="#8C6A3A"/><path d="M200 168 a50 44 0 0 1 100 0" fill="#8C6A3A"/>
    <text x="250" y="240" font-size="30" font-weight="700" fill="#FFF4DA" text-anchor="middle">Reine</text>
    <text x="250" y="278" font-size="20" fill="#C9AE84" text-anchor="middle">Candidate n° 7</text>
    <rect x="50" y="320" width="400" height="18" rx="9" fill="#3A2A18"/><rect x="50" y="320" width="340" height="18" rx="9" fill="url(#bar)"/>
    <rect x="110" y="364" width="280" height="52" rx="26" fill="#2E2114" stroke="#E0B155" stroke-width="3"/>
    <text x="250" y="398" font-size="22" font-weight="700" fill="#F8DE9A" text-anchor="middle">✓ Vote enregistré</text>
  </g>
</svg>
