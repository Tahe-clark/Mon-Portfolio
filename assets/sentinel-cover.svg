<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Illustration du tableau de bord Sentinel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0" stop-color="#34405C"/><stop offset=".6" stop-color="#171C2A"/><stop offset="1" stop-color="#0E1119"/>
    </radialGradient>
    <linearGradient id="feed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A4766"/><stop offset="1" stop-color="#1B2131"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2845C" stop-opacity="0"/><stop offset=".5" stop-color="#F2845C"/><stop offset="1" stop-color="#F2845C" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".08" stroke="#fff">
    <path d="M0 200H1600M0 400H1600M0 600H1600M0 800H1600M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/>
  </g>

  <!-- Téléphone émetteur -->
  <g filter="url(#sh)" transform="translate(150 290)">
    <rect width="250" height="470" rx="40" fill="#1E2434" stroke="#4A5677" stroke-width="4"/>
    <rect x="20" y="40" width="210" height="340" rx="18" fill="url(#feed)"/>
    <circle cx="125" cy="210" r="62" fill="none" stroke="#F2845C" stroke-width="10"/>
    <circle cx="125" cy="210" r="30" fill="#F2845C" opacity=".85"/>
    <rect x="50" y="405" width="150" height="36" rx="18" fill="#F2845C"/>
    <text x="125" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#261A1B" text-anchor="middle">DIFFUSER</text>
  </g>

  <!-- Liaison WebRTC -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M420 520 C 520 520, 540 470, 620 470" stroke="url(#glow)"/>
    <path d="M420 560 C 520 560, 540 610, 620 610" stroke="#F2845C" stroke-dasharray="4 16" opacity=".6"/>
  </g>
  <text x="515" y="440" font-family="Arial, sans-serif" font-size="22" fill="#AAB4CC" text-anchor="middle" letter-spacing="3">WebRTC</text>

  <!-- Tableau de bord -->
  <g filter="url(#sh)" transform="translate(640 170)">
    <rect width="830" height="660" rx="26" fill="#161B27" stroke="#3A4560" stroke-width="3"/>
    <rect width="830" height="64" rx="26" fill="#1F2536"/>
    <rect y="40" width="830" height="24" fill="#1F2536"/>
    <circle cx="40" cy="32" r="9" fill="#F2845C"/><circle cx="70" cy="32" r="9" fill="#5A6583"/><circle cx="100" cy="32" r="9" fill="#5A6583"/>
    <text x="415" y="41" font-family="Arial, sans-serif" font-size="22" fill="#AAB4CC" text-anchor="middle">Sentinel — Tableau de bord</text>

    <!-- Flux vidéo -->
    <rect x="32" y="96" width="530" height="360" rx="16" fill="url(#feed)"/>
    <path d="M32 380 L180 280 L270 340 L380 230 L562 390 V440 a16 16 0 0 1 -16 16 H48 a16 16 0 0 1 -16 -16Z" fill="#11151F" opacity=".55"/>
    <circle cx="470" cy="170" r="34" fill="#F2C4A8" opacity=".35"/>
    <rect x="52" y="116" width="150" height="40" rx="20" fill="#E5484D"/>
    <circle cx="78" cy="136" r="8" fill="#fff"/>
    <text x="95" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">EN DIRECT</text>
    <text x="540" y="436" font-family="Arial, sans-serif" font-size="18" fill="#D5DCEC" text-anchor="end">Caméra · Salon</text>

    <!-- Appareils -->
    <text x="594" y="116" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">Appareils</text>
    <g font-family="Arial, sans-serif" font-size="18" fill="#D5DCEC">
      <rect x="594" y="136" width="204" height="72" rx="12" fill="#1F2536"/><circle cx="624" cy="172" r="10" fill="#F2845C"/><text x="646" y="168">Téléphone</text><text x="646" y="192" fill="#8792AD" font-size="15">Connecté</text>
      <rect x="594" y="222" width="204" height="72" rx="12" fill="#1F2536"/><circle cx="624" cy="258" r="10" fill="#F2845C"/><text x="646" y="254">Tablette</text><text x="646" y="278" fill="#8792AD" font-size="15">Connecté</text>
      <rect x="594" y="308" width="204" height="72" rx="12" fill="#1F2536"/><circle cx="624" cy="344" r="10" fill="#5A6583"/><text x="646" y="340">Portable</text><text x="646" y="364" fill="#8792AD" font-size="15">Hors ligne</text>
    </g>

    <!-- Statistiques -->
    <g font-family="Arial, sans-serif">
      <rect x="32" y="480" width="250" height="146" rx="16" fill="#1F2536"/>
      <text x="56" y="524" font-size="18" fill="#8792AD">Connexion</text><text x="56" y="584" font-size="42" font-weight="700" fill="#fff">Pair-à-pair</text>
      <rect x="302" y="480" width="260" height="146" rx="16" fill="#1F2536"/>
      <text x="326" y="524" font-size="18" fill="#8792AD">Signalisation</text><text x="326" y="584" font-size="40" font-weight="700" fill="#F2845C">WebSocket</text>
      <rect x="594" y="400" width="204" height="226" rx="16" fill="#1F2536"/>
      <text x="618" y="440" font-size="18" fill="#8792AD">Activité</text>
      <path d="M618 590 L650 560 L680 575 L712 520 L744 540 L774 480" fill="none" stroke="#F2845C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
